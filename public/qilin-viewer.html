<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>小麒麟 3D 模型 · 可拖动查看</title>
<style>
  html,body{margin:0;height:100%;background:#f2f5f8;color:#3d4a57;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column}
  header{padding:18px 28px;text-align:center}
  h1{margin:0;font-size:18px;font-weight:500;letter-spacing:.04em}
  p{margin:6px 0 0;font-size:13px;color:#9aa7b4}
  .stage{flex:1;min-height:0;position:relative}
  model-viewer{display:block;width:100%;height:100%;background:transparent;
    cursor:grab;--poster-color:transparent;--progress-bar-color:#7fa3c9;touch-action:none}
  model-viewer:active{cursor:grabbing}
  .tip{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);
    padding:6px 14px;border:1px solid rgba(255,255,255,.85);border-radius:999px;
    background:rgba(255,255,255,.6);backdrop-filter:blur(14px) saturate(1.25);
    color:#6b7a8a;font-size:12px;letter-spacing:.04em;pointer-events:none}
  a{color:#7fa3c9}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>小麒麟 · 3D 模型</h1>
    <p>拖动旋转 · 滚轮缩放 · 约 186 KB · 来源：文生 3D（model-viewer 渲染）</p>
  </header>
  <div class="stage">
    <model-viewer src="qilin.glb" alt="一只可爱的薄荷绿小麒麟手办"
      camera-controls auto-rotate rotation-per-second="18deg"
      camera-orbit="35deg 72deg 105%" shadow-intensity="0.5" shadow-softness="0.9"
      exposure="1.05" environment-image="neutral" interaction-prompt="none"></model-viewer>
    <span class="tip">按住拖动转一转</span>
  </div>
</div>
<script src="model-viewer.min.js"></script>
</body>
</html>
